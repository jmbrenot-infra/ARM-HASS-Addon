name: Build ARM base image

# Builds our own base image from a pinned ARM release (1337server/automatic-ripping-machine:<version>)
# with the mliradelc recipe in .docker/Dockerfile. Started by tools/Update-ArmAddon.ps1 -Source Arm.
on:
  workflow_dispatch:
    inputs:
      arm_version:
        description: 'ARM version (N.N.N), must exist on Docker Hub'
        required: true
        type: string

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ARM_VERSION: ${{ inputs.arm_version }}
    steps:
      - name: Validate version
        run: |
          if ! [[ "$ARM_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::arm_version must be N.N.N, got '$ARM_VERSION'"
            exit 1
          fi
          if ! curl -fs -o /dev/null "https://hub.docker.com/v2/repositories/1337server/automatic-ripping-machine/tags/${ARM_VERSION}"; then
            echo "::error::1337server/automatic-ripping-machine:${ARM_VERSION} is not on Docker Hub"
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: .docker/Dockerfile
          build-args: ARM_VERSION=${{ env.ARM_VERSION }}
          platforms: linux/amd64
          push: true
          tags: ghcr.io/jmbrenot-infra/arm-hass-addon:arm-${{ env.ARM_VERSION }}

      - name: Reminder
        run: |
          {
            echo "Published \`ghcr.io/jmbrenot-infra/arm-hass-addon:arm-${ARM_VERSION}\` (linux/amd64)."
            echo ""
            echo "The Supervisor pulls without credentials: make the package public once"
            echo "(GitHub > Packages > arm-hass-addon > Package settings > Change visibility)."
          } >> "$GITHUB_STEP_SUMMARY"

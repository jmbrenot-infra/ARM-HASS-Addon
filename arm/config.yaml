name: ARM (jmbrenot-infra)
version: "0.2.8-jmb.5"
slug: arm
description: Automatic Ripping Machine
link: https://github.com/jmbrenot-infra/ARM-HASS-Addon
arch:
  - amd64
  - aarch64
startup: application
boot: auto
init: true
ports:
  8089/tcp: 8089
ports_description:
  8089/tcp: ARM Web UI
watchdog: "http://[HOST]:8089"
webui: "http://[HOST]:[PORT:8089]"
options:
  web_port: 8089
  auto_rip: true
  ma_url: ""
  ma_token: ""
  ma_provider: ""
schema:
  web_port: int
  auto_rip: bool
  ma_url: str?
  ma_token: password?
  ma_provider: str?
map:
  - addon_config:rw
  - share:rw
  - media:rw
full_access: true
devices:
  - /dev/dri
  - /dev/sr0
  - /dev/sg0
  - /dev/dri/renderD128
device_tree: true
udev: true
kernel_modules: true
privileged:
   - SYS_ADMIN   
   - DAC_READ_SEARCH
   - NET_ADMIN
   - SYS_RAWIO
panel_icon: mdi:compact-disc
panel_title: "ARM"
ingress: true
ingress_port: 8089
